archivos:
  carga: "datos/originales/Carga Docente 2021-2026 1.xlsx"
  rendimiento: "datos/originales/Base Rendimiento 2021-2026 1.xlsx"
  perfeccionamiento: "datos/originales/Perfeccionamiento pedagógico docente consolidado 2026 2.xlsx"
  cohortes: "datos/originales/cohortes_diplomado.csv"
  # Docentes de la versión 6 (empieza nov. 2026). Columnas: rut_sin_dv, dv, anio_certificacion_esperado
  cohorte_futura: "datos/originales/cohorte_futura.csv"
  # Postulantes al diplomado por versión (Ricardo, nov. 2026): cohortes futuras y desertores
  postulantes: "datos/originales/Postulantes Diplomado.xlsx"
  # Características de los docentes VIGENTES hoy (foto actual, no histórica)
  info_docente: "datos/originales/Información del Docente.xlsx"
  # Equivalencias de asignaturas de la modernización curricular 2026 (Ricardo, 23 nov). Solo la usa el 14.
  equivalencias_2026: "datos/originales/Equivalencias 2026.xlsx"
analisis:
  nombre_programa: "DIPLOMADO EN DOCENCIA PARA LA EDUCACION SUPERIOR"
  anio_inicio: 2021
  anio_fin: 2026
  solo_calificables: true
  solo_activos: true
  excluir_nrc_no_numerico: true
  excluir_posgrados: true
  criterio_docencia: "unico_docente"  # unico_docente; todos_descriptivo
  minimo_estudiantes_seccion: 5
  # Módulos 06 a 13. "unico" = solo secciones con un docente (principal desde el 24 nov: sin
  # saber quién pone la nota, repartir diluye el efecto y contamina a los controles que comparten
  # sección con tratados). "todos" = todas las secciones repartidas por igual entre sus docentes
  # (indicación de Ricardo, 23 nov); el 13 la reporta siempre al lado como robustez.
  regla_atribucion: "unico"
  preferir_hoja_mas_reciente: true
  generar_exportaciones_detalle: true
analisis_anual:
  activar: true
  ejecutar_regresiones: true
  excluir_anio_certificacion: true
did:
  activar: true
  estimar: true        # false: solo exporta los conteos
  bootstrap_iter: 999
  semilla: 20261119
  # Año de certificado supuesto para los postulantes cuya versión "aún no inicia"
  anio_cert_no_inicia: 2027
  # Robustez: repetir las especificaciones principales cortando el panel en este año (en 2026 hay muy pocos controles)
  anio_corte_robustez: 2025
# Script 07: replicación de Angrist y Lavy (DiD con controles emparejados por cohorte). Ver encabezado del 07.
emparejamiento:
  activar: true
  # Año de inicio de las versiones que no están en la base de postulantes (solo lo usa el 07 antiguo)
  # 23 nov: la versión que certificó en 2023 empezó el 22 may 2023 (Camila). Antes se suponía 2022.
  inicio_supuesto:
    "2023": 2023
  mes_inicio_supuesto: 5
  ratio: 3              # controles por tratado (principal)
  ratio_robustez: 5
  distancia: "robust_mahalanobis"
  caliper_de: 0.25      # en desviaciones estándar de cada variable
  caliper_variables: ["nota_rel_pre", "aprob_rel_pre", "prop_trim_pre"]
  # Sensibilidad exacto_ampliado: variables exactas además del régimen principal
  exacto_robustez: ["con_formacion_previa"]
  resultados_principales: ["nota_rel", "aprob_rel"]
  resultados_robustez: ["nota", "aprob"]
  semilla: 20261121
inferencia:
  alpha: 0.07
# Tratamiento (módulo 08). Versiones del diplomado que no están en la base de postulantes:
# sus certificados reciben la fecha de inicio de la versión. Nunca reemplaza una fecha de postulantes.
tratamiento:
  versiones_sin_postulacion:
    - anio_certificado: 2023
      fecha_inicio: "2023-05-22"
      fecha_fin: "2023-11-25"
      fuente: "Camila, reunión 23 nov 2026"
